# 1. limit_req_zone МАЄ бути поза блоком server (на рівні http)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

upstream main_app {
    server backend:8000;
}

upstream notes_app {
    server notes_backend:8001;
}

upstream bucket {
    server s3-bucket:9000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 15M;

    if ($request_uri ~* "(\.\./|--|select|union|insert|drop|delete|update|truncate)") {
        return 403;
    }

    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$ ) {
        return 405;
    }


    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://main_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notes/ {
        proxy_pass http://notes_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /bucket/ {
        proxy_pass http://bucket/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
}